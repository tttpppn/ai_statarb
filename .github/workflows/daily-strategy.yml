name: Daily Strategy Execution

on:
  schedule:
    - cron: '9 9 * * *'  # Run 9:09 AM UTC daily
  workflow_dispatch:  # Manual trigger

jobs:
  run-strategy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: backtest/thorp-statarb-v1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r ai_statarb/requirements.txt

      - name: Run daily screening
        env:
          AI4TRADE_API_TOKEN: ${{ secrets.AI4TRADE_API_TOKEN }}
        run: |
          python -m ai_statarb.main --mode paper-trade

      - name: Log results
        if: always()
        run: |
          echo "Strategy execution completed"
